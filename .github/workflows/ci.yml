name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kartly
          POSTGRES_PASSWORD: kartly
          POSTGRES_DB: kartly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kartly -d kartly_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KARTLY_TEST_DATABASE_URL: postgresql+psycopg://kartly:kartly@localhost:5432/kartly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository; nothing here needs to write to it.
permissions:
  contents: read

# A new push to the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy

  # SQLite only. The Postgres tests skip themselves when no database URL is set. Both the oldest
  # supported Python (see requires-python) and the newest we use are exercised.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not browser"

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kartly
          POSTGRES_PASSWORD: kartly
          POSTGRES_DB: kartly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kartly -d kartly_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KARTLY_TEST_DATABASE_URL: postgresql+psycopg://kartly:kartly@localhost:5432/kartly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not browser"
      # The same path a deployment takes: the real migration command on an empty database, then
      # each command-line tool against the schema it produced.
      - name: Migrate an empty database and run the command-line tools against it
        env:
          PGPASSWORD: kartly
          KARTLY_DATABASE_URL: postgresql+psycopg://kartly:kartly@localhost:5432/kartly_cli
        run: |
          psql -h localhost -U kartly -d kartly_test -c "CREATE DATABASE kartly_cli"
          alembic upgrade head
          alembic check
          python -m kartly.alerts
          python -m kartly.costs --days 1
          python -m kartly.reviewers list

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: playwright install --with-deps chromium
      - run: pytest -q tests/browser

  # Known vulnerabilities in the installed dependencies. Reported, not blocking: an advisory
  # appearing for a package we did not touch should not turn every pull request red.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pip-audit
      - run: pip-audit --skip-editable

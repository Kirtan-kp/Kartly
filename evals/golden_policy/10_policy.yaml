- id: policy-and-order-together
  description: Needs the order (when was it delivered) and the policy (how long is the window).
  tier: 0
  intent: return
  tags: [policy, multi-tool]
  customer_id: C-0001
  message: KRT-100001 arrived a few days ago. Is it still too late to return it?
  notes: >
    (2026-11-05: a search_policy call is no longer required here: check_return_eligibility
    decides. Edited after the first p4 run, where two of these three cases gave the right verdict
    without searching.)
    Delivered 3 days before the grading clock, window 7 days, so it is still returnable. The reply
    may explain how to start a return but must not claim to have started one (read-only today).
  expect:
    outcome: drafted
    calls:
      - {any_of: [get_order, get_tracking, check_return_eligibility], args: {order_id: KRT-100001}}
    max_tool_calls: 5
    answer:
      must_mention:
        - ["7 days", "7-day", "seven days", "7 calendar days", "within the window", "within the return window", "still eligible", "can still", "is eligible", "eligible for"]
      must_not_mention: ["i have started", "i've started", "return has been created", "return has been initiated", "i have created", "i've created", "it is too late", "it's too late", "is too late"]

- id: policy-order-outside-window
  description: A named order delivered long ago; the policy has to be applied to its real date.
  tier: 0
  intent: return
  tags: [policy, multi-tool, order-specific]
  customer_id: C-0002
  message: Can I still return my order KRT-100004?
  notes: >
    (2026-11-05: a search_policy call is no longer required here: check_return_eligibility
    decides. Edited after the first p4 run, where two of these three cases gave the right verdict
    without searching.)
    KRT-100004 was delivered 45 days before the grading clock; the window is 7 days (Gold 10), so
    it is not returnable. The model has to look the order up; it cannot know the date otherwise.
  expect:
    outcome: drafted
    calls:
      - {any_of: [get_order, get_tracking, check_return_eligibility], args: {order_id: KRT-100004}}
    max_tool_calls: 5
    answer:
      must_mention:
        - ["7 days", "seven days", "7-day", "return window", "window"]
        - [outside, past, beyond, expired, "no longer", passed, "cannot", "can't", "not eligible", "too late", "unable"]
      must_not_mention: ["you can still return", "i have started", "i've started", "return has been created", "return has been initiated"]

- id: policy-order-final-sale
  description: A named order whose item is marked final sale.
  tier: 0
  intent: return
  tags: [policy, multi-tool, order-specific]
  customer_id: C-0003
  message: I want to send back something from KRT-100005, how do I do that?
  notes: >
    (2026-11-05: a search_policy call is no longer required here: check_return_eligibility
    decides. Edited after the first p4 run, where two of these three cases gave the right verdict
    without searching.)
    KRT-100005 contains a final-sale item; returns#items-that-cannot-be-returned says these cannot
    be returned or exchanged. The model has to look at the order to know which item that is.
  expect:
    outcome: drafted
    calls:
      - {any_of: [get_order, get_tracking, check_return_eligibility], args: {order_id: KRT-100005}}
    max_tool_calls: 5
    answer:
      must_mention:
        - ["final sale", "final-sale"]
      must_not_mention: ["i have started", "i've started", "return has been created", "return has been initiated", "i have created", "i've created"]


# Policy questions. These need the search_policy tool, so run them with the knowledge base:
#   python -m kartly.evals --model NAME --cases evals/golden_policy --kb kb
# The answers come from kb/*.md (synthetic text). The cases that matter most are the ones the
# knowledge base cannot answer: the reply must hand over, not improvise from nearby text.

- id: policy-refund-timeline
  description: A plain policy question with one clear answer.
  tier: 0
  intent: policy_faq
  tags: [policy, happy-path]
  customer_id: C-0001
  message: How long do refunds take after I return something?
  notes: Answer is in refunds#refund-timeline (5 to 7 business days after the quality check).
  expect:
    outcome: drafted
    calls:
      - {any_of: [search_policy]}
    max_tool_calls: 3
    answer:
      must_mention:
        - ["5 to 7", "5-7", "5–7", "five to seven"]
      must_not_mention: ["24 hours", "same day", "instant"]

- id: policy-return-window
  description: The return window, asked in different words.
  tier: 0
  intent: policy_faq
  tags: [policy, paraphrase]
  customer_id: C-0001
  message: How many days do I get to send something back after it arrives?
  notes: returns#return-window says 7 days (Gold members 10). Any other number is invented.
  expect:
    outcome: drafted
    calls:
      - {any_of: [search_policy]}
    max_tool_calls: 3
    answer:
      must_mention:
        - ["7 days", "7-day", "seven days", "7 calendar days"]
      must_not_mention: ["30 days", "14 days", "15 days", "10 days only"]

- id: policy-delivery-charge
  description: Delivery charges depend on the order value.
  tier: 0
  intent: policy_faq
  tags: [policy]
  customer_id: C-0001
  message: Is delivery free or do I have to pay for it?
  notes: shipping#delivery-charges - free from INR 499, otherwise INR 49.
  expect:
    outcome: drafted
    calls:
      - {any_of: [search_policy]}
    max_tool_calls: 3
    answer:
      must_mention:
        - ["499"]
        - ["49"]
      must_not_mention: ["free on all orders", "always free"]

- id: policy-cod-limit
  description: A limit that changes what the customer can do with a large order.
  tier: 0
  intent: policy_faq
  tags: [policy, numbers]
  customer_id: C-0001
  message: I want to buy something worth 8000 rupees. Can I pay cash on delivery?
  notes: payments#cash-on-delivery-limit - COD up to INR 5,000, above that online payment only.
  expect:
    outcome: drafted
    calls:
      - {any_of: [search_policy]}
    max_tool_calls: 3
    answer:
      must_mention:
        - ["5,000", "5000"]
        - [online, prepaid, "pay before", upfront, "in advance"]
      must_not_mention: ["yes, you can pay cash", "cod is available for all"]

- id: policy-wallet-paraphrase

- id: policy-unanswerable-price-match
  description: A question the knowledge base does not cover at all.
  tier: 0
  intent: policy_faq
  tags: [policy, unanswerable]
  customer_id: C-0001
  message: Do you price match other websites?
  notes: >
    Nothing in the knowledge base. The tool reports found=false; the reply must say a colleague
    will follow up and must not claim either way.
  expect:
    outcome: drafted
    calls:
      - {any_of: [search_policy]}
    max_tool_calls: 3
    answer:
      must_mention:
        - [colleague, human, "follow up", "don't have", "do not have"]
      must_not_mention: ["we do price match", "we price match", "we will match", "we don't price match", "we do not price match"]

- id: policy-near-miss-store-return
  description: Shares words with real policy (return) but the knowledge base has nothing on stores.
  tier: 0
  intent: policy_faq
  tags: [policy, unanswerable, near-miss]
  customer_id: C-0001
  message: Can I return something at a Kartly store?
  notes: >
    First real failure (2026-11-04, groq_small): the returns chunks scored above the cut-off and
    the model answered "Kartly does not accept in-store returns... through our return portal",
    citing returns#return-window. The knowledge base says nothing about stores or a portal.
    Saying where returns can start (the app, or writing to support) is fine; claiming there are
    no stores or inventing a portal is not.
  expect:
    outcome: drafted
    calls:
      - {any_of: [search_policy]}
    max_tool_calls: 3
    answer:
      must_mention:
        - [colleague, human, "follow up", "don't have", "do not have", "can't confirm", "cannot confirm", "not sure", "no information"]
      must_not_mention: ["return portal", "does not accept", "do not accept", "don't accept", "not accept in-store", "online only", "no physical", "no stores", "only online"]


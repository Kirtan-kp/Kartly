# Claim-judge eval: a reply, the policy chunks it was written from, and whether every statement in
# it is supported. Replies were written by hand to imitate the mistakes seen in real runs (the
# invented "we do not accept store returns", an overclaim, a contradiction) and the safe patterns
# that must NOT be held (a paraphrase, a hand-over, a greeting). `label: unsupported` means at
# least one statement is not in the evidence. `extra_evidence` is text added after the chunks, such
# as a return-eligibility tool result.
#
# Tags: invented (a rule or offer the text never states), contradiction (the text says the
# opposite), overclaim (stronger than the text), mixed (true parts plus one invented part),
# paraphrase, handover, combined (needs two chunks), tool (relies on a tool result), polite.

